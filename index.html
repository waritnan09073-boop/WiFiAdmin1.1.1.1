<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>เข้าสู่ระบบ Wi-Fi</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 255, 150, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(180, 240, 255, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(255, 220, 150, 0.3),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(255, 180, 220, 0.3),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #f9f9d9,
          #e9f8f7,
          #f9e9f7
        );

      overflow-x: hidden;
    }


    /* =========================
       กล่องหลัก
    ========================= */

    .container {
      width: 100%;
      max-width: 430px;

      min-height: 100vh;

      padding:
        35px
        20px
        30px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 150px;
      height: 150px;

      max-width: 60vw;

      object-fit: contain;

      display: block;

      margin-bottom: 25px;
    }


    /* =========================
       ช่องกรอก
    ========================= */

    .input-box {
      width: 100%;

      height: 55px;

      padding: 5px;

      margin-bottom: 18px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 190, 220, 0.55),
          rgba(220, 230, 255, 0.65)
        );

      border:
        2px solid
        rgba(255, 255, 255, 0.8);

      display: flex;
      align-items: center;
    }


    input[type="text"],
    input[type="password"] {

      width: 100%;
      height: 100%;

      border: none;
      outline: none;

      background:
        rgba(245, 250, 235, 0.9);

      color: #111;

      text-align: center;

      font-size: 18px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }


    input::placeholder {
      color: #222;
      opacity: 1;
    }


    input:focus {
      background:
        rgba(255, 255, 255, 0.95);
    }


    /* =========================
       ปุ่ม Login
    ========================= */

    .login-button {

      width: 100%;
      height: 55px;

      padding: 5px;

      margin-bottom: 18px;

      border:
        2px solid
        rgba(255, 255, 255, 0.8);

      background:
        linear-gradient(
          90deg,
          rgba(255, 190, 220, 0.55),
          rgba(220, 230, 255, 0.65)
        );

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .login-button span {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(245, 250, 235, 0.9);

      color: #111;

      font-size: 18px;
    }


    .login-button:active {
      transform: scale(0.98);
    }


    /* =========================
       จดจำรหัส
    ========================= */

    .remember {

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 18px;

      color: #111;

      cursor: pointer;
    }


    .remember input {

      appearance: none;

      width: 28px;
      height: 28px;

      flex:
        0 0 28px;

      margin: 0;

      background:
        rgba(255, 255, 255, 0.45);

      border:
        2px solid
        #d9e9ff;

      cursor: pointer;
    }


    .remember input:checked {

      background:
        linear-gradient(
          135deg,
          #ffd0e7,
          #d5f3ff
        );

      position: relative;
    }


    .remember input:checked::after {

      content: "✓";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: 20px;

      color: #555;
    }


    /* =========================
       Login สำเร็จ
    ========================= */

    .success {

      display: none;

      width: 100%;

      margin-top: 20px;

      padding: 20px;

      text-align: center;

      font-size: 22px;

      color: #111;

      background:
        rgba(255, 255, 255, 0.55);

      border:
        2px solid
        rgba(255, 255, 255, 0.8);
    }


    .success small {

      display: block;

      margin-top: 10px;

      font-size: 16px;
    }


    /* =========================
       หน้าจอเล็กมาก
    ========================= */

    @media (max-width: 360px) {

      .container {

        padding:
          25px
          15px
          25px;
      }


      .logo {

        width: 125px;
        height: 125px;

        margin-bottom: 20px;
      }


      .input-box,
      .login-button {

        height: 50px;

        margin-bottom: 15px;
      }


      input[type="text"],
      input[type="password"],
      .login-button span {

        font-size: 16px;
      }


      .remember {

        font-size: 16px;
      }


      .remember input {

        width: 25px;
        height: 25px;

        flex-basis: 25px;
      }
    }

  </style>
</head>


<body>


  <main class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <img
      src="logo.PNG"
      alt="Wi-Fi Logo"
      class="logo"
    >


    <!-- =========================
         ชื่อผู้ใช้
    ========================== -->

    <div class="input-box">

      <input
        id="username"
        type="text"
        placeholder="ชื่อผู้ใช้"
        autocomplete="username"
      >

    </div>


    <!-- =========================
         รหัสผ่าน
    ========================== -->

    <div class="input-box">

      <input
        id="password"
        type="password"
        placeholder="รหัสผ่าน"
        autocomplete="current-password"
      >

    </div>


    <!-- =========================
         ปุ่มเข้าใช้งาน
    ========================== -->

    <button
      class="login-button"
      onclick="login()"
    >

      <span>
        เข้าใช้งาน
      </span>

    </button>


    <!-- =========================
         จดจำรหัส
    ========================== -->

    <label class="remember">

      <input
        type="checkbox"
        id="remember"
      >

      <span>
        จดจำรหัส
      </span>

    </label>


    <!-- =========================
         สำเร็จ
    ========================== -->

    <div
      class="success"
      id="success"
    >

      ✅ เข้าสู่ระบบสำเร็จ

      <small>
        ยินดีต้อนรับเข้าสู่ Wi-Fi
      </small>

    </div>


  </main>


  <script>

    /* =================================
       Username และ Password
    ================================= */

    const CORRECT_USERNAME1 = "Admin";

    const CORRECT_PASSWORD1 = "23451";
    
    const CORRECT_USERNAME2 = "Develop";

    const CORRECT_PASSWORD2 = "123451";



    /* =================================
       โหลดข้อมูลที่จดจำ
    ================================= */

    window.addEventListener(
      "load",
      function () {

        const savedUser =
          localStorage.getItem(
            "wifi_username"
          );

        const savedPass =
          localStorage.getItem(
            "wifi_password"
          );


        if (
          savedUser &&
          savedPass
        ) {

          document.getElementById(
            "username"
          ).value = savedUser;


          document.getElementById(
            "password"
          ).value = savedPass;


          document.getElementById(
            "remember"
          ).checked = true;

        }

      }
    );


    /* =================================
       Login
    ================================= */

    function login() {

      const username =
        document.getElementById(
          "username"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      const remember =
        document.getElementById(
          "remember"
        ).checked;


      /* -------------------------------
         ไม่ใส่ Username
      -------------------------------- */

      if (!username) {

        alert(
          "กรุณาใส่ชื่อผู้ใช้ในช่องด้วย"
        );

        document.getElementById(
          "username"
        ).focus();

        return;
      }


      /* -------------------------------
         ไม่ใส่ Password
      -------------------------------- */

      if (!password) {

        alert(
          "กรุณาใส่รหัสผ่านในช่องด้วย"
        );

        document.getElementById(
          "password"
        ).focus();

        return;
      }


      /* -------------------------------
         ตรวจข้อมูล
      -------------------------------- */

      if (
        username === CORRECT_USERNAME &&
        password === CORRECT_PASSWORD
      ) {


        /* =============================
           จดจำรหัส
        ============================= */

        if (remember) {

          localStorage.setItem(
            "wifi_username",
            username
          );

          localStorage.setItem(
            "wifi_password",
            password
          );

        } else {

          localStorage.removeItem(
            "wifi_username"
          );

          localStorage.removeItem(
            "wifi_password"
          );

        }


        /* =============================
           ซ่อนหน้า Login
        ============================= */

        document
          .querySelectorAll(
            ".input-box"
          )
          .forEach(
            function (box) {

              box.style.display =
                "none";

            }
          );


        document.querySelector(
          ".login-button"
        ).style.display =
          "none";


        document.querySelector(
          ".remember"
        ).style.display =
          "none";


        /* =============================
           แสดงสำเร็จ
        ============================= */

        document.getElementById(
          "success"
        ).style.display =
          "block";


      } else {


        /* =============================
           รหัสผิด
        ============================= */

        alert(
          "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
        );

      }

    }

  </script>


</body>
</html>

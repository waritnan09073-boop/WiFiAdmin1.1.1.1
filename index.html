<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f9e9f7">

  <link rel="manifest" href="./manifest.json">

  <title>เข้าสู่ระบบ Wi-Fi</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 255, 150, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(180, 240, 255, 0.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(255, 220, 150, 0.30),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(255, 180, 220, 0.30),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #f9f9d9,
          #e9f8f7,
          #f9e9f7
        );

      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;

      padding: 30px 20px 30px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 145px;
      height: 145px;

      object-fit: contain;

      display: block;

      margin-bottom: 22px;
    }

    /* =========================
       ช่องกรอก
    ========================= */

    .input-box {
      width: 100%;
      height: 55px;

      padding: 5px;
      margin-bottom: 15px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 190, 220, 0.55),
          rgba(220, 230, 255, 0.65)
        );

      border:
        2px solid
        rgba(255, 255, 255, 0.8);

      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 100%;

      border: none;
      outline: none;

      background:
        rgba(245, 250, 235, 0.9);

      color: #111;

      text-align: center;

      font-size: 18px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    input::placeholder {
      color: #222;
      opacity: 1;
    }

    /* =========================
       ปุ่ม Login
    ========================= */

    .login-button {
      width: 100%;
      height: 55px;

      padding: 5px;
      margin-bottom: 15px;

      border:
        2px solid
        rgba(255, 255, 255, 0.8);

      background:
        linear-gradient(
          90deg,
          rgba(255, 190, 220, 0.55),
          rgba(220, 230, 255, 0.65)
        );

      cursor: pointer;
    }

    .login-button span {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(245, 250, 235, 0.9);

      color: #111;

      font-size: 18px;
    }

    .login-button:active {
      transform: scale(0.98);
    }

    /* =========================
       จำรหัส
    ========================= */

    .remember {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 17px;

      color: #111;

      cursor: pointer;

      margin-bottom: 25px;
    }

    .remember input {
      appearance: none;

      width: 26px;
      height: 26px;

      flex: 0 0 26px;

      margin: 0;

      background:
        rgba(255, 255, 255, 0.45);

      border:
        2px solid
        #d9e9ff;

      cursor: pointer;
    }

    .remember input:checked {
      background:
        linear-gradient(
          135deg,
          #ffd0e7,
          #d5f3ff
        );

      position: relative;
    }

    .remember input:checked::after {
      content: "✓";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: 19px;

      color: #555;
    }

    /* =========================
       QR CODE
    ========================= */

    .qr-section {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 5px;
    }

    .qr-title {
      font-size: 22px;

      margin-bottom: 10px;

      color: #111;
    }

    .wifi-qr {
      width: 210px;
      height: 210px;

      object-fit: contain;

      display: block;

      background: white;

      padding: 8px;

      border-radius: 14px;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.08);
    }

    .qr-text {
      margin-top: 10px;

      font-size: 15px;

      text-align: center;

      color: #333;
    }

    /* =========================
       Login สำเร็จ
    ========================= */

    .success {
      display: none;

      width: 100%;

      margin-top: 10px;

      padding: 18px;

      text-align: center;

      font-size: 21px;

      color: #111;

      background:
        rgba(255, 255, 255, 0.55);

      border:
        2px solid
        rgba(255, 255, 255, 0.8);
    }

    .success small {
      display: block;

      margin-top: 8px;

      font-size: 15px;
    }

    /* =========================
       Logout
    ========================= */

    .logout-button {
      display: none;

      width: 100%;

      height: 50px;

      margin-top: 15px;

      border: none;

      background:
        rgba(255, 255, 255, 0.7);

      font-size: 17px;

      cursor: pointer;
    }

    .logout-button:active {
      transform: scale(0.98);
    }

    /* =========================
       จอเล็ก
    ========================= */

    @media (max-width: 360px) {

      .container {
        padding: 22px 15px 25px;
      }

      .logo {
        width: 120px;
        height: 120px;

        margin-bottom: 18px;
      }

      .input-box,
      .login-button {
        height: 50px;

        margin-bottom: 13px;
      }

      input[type="text"],
      input[type="password"],
      .login-button span {
        font-size: 16px;
      }

      .remember {
        font-size: 16px;

        margin-bottom: 20px;
      }

      .remember input {
        width: 24px;
        height: 24px;

        flex-basis: 24px;
      }

      .qr-title {
        font-size: 20px;
      }

      .wifi-qr {
        width: 180px;
        height: 180px;
      }

      .qr-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         LOGO
    ========================== -->

    <img
      src="logo.PNG"
      alt="Logo"
      class="logo"
    >


    <!-- =========================
         ชื่อผู้ใช้
    ========================== -->

    <div class="input-box">

      <input
        id="username"
        type="text"
        placeholder="ชื่อผู้ใช้"
        autocomplete="username"
      >

    </div>


    <!-- =========================
         รหัสผ่าน
    ========================== -->

    <div class="input-box">

      <input
        id="password"
        type="password"
        placeholder="รหัสผ่าน"
        autocomplete="current-password"
      >

    </div>


    <!-- =========================
         ปุ่มเข้าใช้งาน
    ========================== -->

    <button
      class="login-button"
      onclick="login()"
    >

      <span>
        เข้าใช้งาน
      </span>

    </button>


    <!-- =========================
         จำรหัส
    ========================== -->

    <label class="remember">

      <input
        type="checkbox"
        id="remember"
      >

      <span>
        จดจำรหัส
      </span>

    </label>


    <!-- =========================
         QR Wi-Fi
    ========================== -->

    <section class="qr-section">

      <div class="qr-title">
        IPHONE
      </div>

      <img
        src="wifi-qr.JPG"
        alt="QR Code Wi-Fi"
        class="wifi-qr"
      >

      <div class="qr-text">
        📱 สแกน QR Code เพื่อเชื่อมต่อ Wi-Fi
      </div>

    </section>


    <!-- =========================
         Login สำเร็จ
    ========================== -->

    <div
      class="success"
      id="success"
    >

      ✅ เข้าสู่ระบบสำเร็จ

      <small id="welcomeText">
        ยินดีต้อนรับเข้าสู่ Wi-Fi
      </small>

    </div>


    <!-- =========================
         ออกจากระบบ
    ========================== -->

    <button
      class="logout-button"
      id="logoutButton"
      onclick="logout()"
    >
      ออกจากระบบ
    </button>

  </main>


  <script>

    /* =================================
       บัญชีผู้ใช้
    ================================= */

    const ACCOUNTS = [

      {
        username: "Admin",
        password: "09871"
      },

      {
        username: "Develop",
        password: "23451"
      }

    ];


    /* =================================
       โหลดข้อมูลที่จำไว้
    ================================= */

    window.addEventListener(
      "load",
      function () {

        const savedUser =
          localStorage.getItem(
            "wifi_username"
          );

        const savedPass =
          localStorage.getItem(
            "wifi_password"
          );


        if (
          savedUser &&
          savedPass
        ) {

          document.getElementById(
            "username"
          ).value =
            savedUser;


          document.getElementById(
            "password"
          ).value =
            savedPass;


          document.getElementById(
            "remember"
          ).checked =
            true;

        }

      }
    );


    /* =================================
       Login
    ================================= */

    function login() {

      const username =
        document.getElementById(
          "username"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      const remember =
        document.getElementById(
          "remember"
        ).checked;


      /* ===============================
         ไม่ใส่ชื่อผู้ใช้
      ================================ */

      if (!username) {

        alert(
          "กรุณาใส่ชื่อผู้ใช้ในช่องด้วย"
        );

        document.getElementById(
          "username"
        ).focus();

        return;
      }


      /* ===============================
         ไม่ใส่รหัสผ่าน
      ================================ */

      if (!password) {

        alert(
          "กรุณาใส่รหัสผ่านในช่องด้วย"
        );

        document.getElementById(
          "password"
        ).focus();

        return;
      }


      /* ===============================
         ตรวจบัญชี
      ================================ */

      const account =
        ACCOUNTS.find(
          function (item) {

            return (
              item.username === username &&
              item.password === password
            );

          }
        );


      /* ===============================
         Login สำเร็จ
      ================================ */

      if (account) {

        if (remember) {

          localStorage.setItem(
            "wifi_username",
            username
          );

          localStorage.setItem(
            "wifi_password",
            password
          );

        } else {

          localStorage.removeItem(
            "wifi_username"
          );

          localStorage.removeItem(
            "wifi_password"
          );

        }


        /* ซ่อนช่อง Login */

        document
          .querySelectorAll(
            ".input-box"
          )
          .forEach(
            function (box) {

              box.style.display =
                "none";

            }
          );


        document.querySelector(
          ".login-button"
        ).style.display =
          "none";


        document.querySelector(
          ".remember"
        ).style.display =
          "none";


        document.querySelector(
          ".qr-section"
        ).style.display =
          "none";


        /* ข้อความต้อนรับ */

        document.getElementById(
          "welcomeText"
        ).textContent =
          "ยินดีต้อนรับ " +
          account.username +
          " เข้าสู่ Wi-Fi";


        /* แสดงสำเร็จ */

        document.getElementById(
          "success"
        ).style.display =
          "block";


        document.getElementById(
          "logoutButton"
        ).style.display =
          "block";

      }


      /* ===============================
         Login ไม่สำเร็จ
      ================================ */

      else {

        alert(
          "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
        );

      }

    }


    /* =================================
       Logout
    ================================= */

    function logout() {

      localStorage.removeItem(
        "wifi_username"
      );

      localStorage.removeItem(
        "wifi_password"
      );


      document
        .querySelectorAll(
          ".input-box"
        )
        .forEach(
          function (box) {

            box.style.display =
              "flex";

          }
        );


      document.querySelector(
        ".login-button"
      ).style.display =
        "block";


      document.querySelector(
        ".remember"
      ).style.display =
        "flex";


      document.querySelector(
        ".qr-section"
      ).style.display =
        "flex";


      document.getElementById(
        "success"
      ).style.display =
        "none";


      document.getElementById(
        "logoutButton"
      ).style.display =
        "none";


      document.getElementById(
        "username"
      ).value =
        "";


      document.getElementById(
        "password"
      ).value =
        "";


      document.getElementById(
        "remember"
      ).checked =
        false;

    }


    /* =================================
       Offline Mode
    ================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./sw.js")
            .then(
              function () {

                console.log(
                  "Offline Mode พร้อมใช้งาน"
                );

              }
            )
            .catch(
              function (error) {

                console.log(
                  "Offline Mode Error:",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>
</html>
